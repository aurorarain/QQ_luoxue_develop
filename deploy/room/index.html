<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 536, H = 270, FLOOR_Y = 200;

const img = {};
['idle','walk1','walk2','sit','type','draw','read','lie','phone','eat','side1','side2'].forEach(k => {
  const i = new Image(); i.src = '/assets/luoxue-current/' + k + '.png'; i.onload = () => (img[k] = i);
});

const SPOTS = { bed: 129, sofa: 235, desk: 374, window: 250, center: 235 };
let dayTint = 0.1, rainKind = '', daylight = 0, lights = {}, sleepMode = 'awake', clockStr = '';
const ustate = { umbrella: { rain: true, sun: true }, wet: false };
let props = [];
const state = { x: 250, target: 250, pose: 'idle', spot: 'center', walking: false, facing: 1,
                wardrobe: { open: false, lastText: 0 } };

const STAT_ORDER = [
  ['体力', 'f1'], ['心情', 'f2'], ['亲密', 'f3'], ['信任', 'f4'],
  ['兴致', 'f5'], ['睡意', 'f6'], ['饥饿', 'f7']
];
let statBars = {};

function px(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x|0, y|0, w|0, h|0); }

function drawWindowScene(t) {
  const wx = 68, wy = 38, ww = 92, wh = 74;
  // 天色：白天亮蓝，黄昏橙，夜里深蓝
  const hue = daylight;
  const skyTop = hue > 0.5 ? '#3f7fd6' : hue > 0.15 ? '#3b4a86' : '#0b1530';
  const skyBottom = hue > 0.5 ? '#9dd0ff' : hue > 0.15 ? '#e08a5a' : '#132148';
  const grad = ctx.createLinearGradient(wx, wy, wx, wy + wh);
  grad.addColorStop(0, skyTop); grad.addColorStop(1, skyBottom);
  ctx.fillStyle = grad; ctx.fillRect(wx, wy, ww, wh);

  // 太阳 / 月亮
  const phase = (t * 0.004) % 1;
  if (daylight > 0.12) {
    const sx = wx + 12 + ((1 - Math.min(1, Math.max(0, daylight))) * 40);
    ctx.fillStyle = '#ffe9a8';
    ctx.fillRect(sx | 0, (wy + 14) | 0, 8, 8);
    ctx.fillStyle = 'rgba(255,233,168,.22)';
    ctx.fillRect((sx - 4) | 0, (wy + 10) | 0, 16, 16);
  } else {
    ctx.fillStyle = '#e8f1ff';
    ctx.fillRect((wx + 62) | 0, (wy + 12) | 0, 7, 7);
    ctx.fillStyle = 'rgba(232,241,255,.18)';
    ctx.fillRect((wx + 58) | 0, (wy + 8) | 0, 15, 15);
  }

  // 星星只在夜里
  if (daylight < 0.2) {
    for (let i = 0; i < 14; i++) {
      const sx2 = wx + ((i * 41) % ww), sy2 = wy + ((i * 27) % wh);
      if ((i + Math.floor(t * 0.6)) % 5 === 0) px(sx2, sy2, 1, 1, '#dce9ff');
    }
  }

  // 窗外天气
  if (rainKind) {
    const n = rainKind === 'storm' ? 46 : 22;
    for (let i = 0; i < n; i++) {
      const x = wx + ((i * 17 + t * (rainKind === 'storm' ? 120 : 70)) % ww);
      const y = wy + ((i * 13 + t * (rainKind === 'storm' ? 210 : 140)) % wh);
      ctx.fillStyle = rainKind === 'storm' ? 'rgba(200,220,255,.75)' : 'rgba(200,220,255,.5)';
      ctx.fillRect(x | 0, y | 0, 1, rainKind === 'storm' ? 5 : 3);
    }
    if (rainKind === 'storm' && Math.sin(t * 7) > 0.985) {
      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.fillRect(wx, wy, ww, wh);
    }
  }
  // 窗框（四边闭合）
  px(wx - 4, wy - 4, ww + 8, 4, '#3a2f5c');
  px(wx - 4, wy + wh, ww + 8, 4, '#3a2f5c');
  px(wx - 4, wy - 4, 4, wh + 8, '#3a2f5c');
  px(wx + ww, wy - 4, 4, wh + 8, '#3a2f5c');
  px(wx + (ww >> 1) - 1, wy, 2, wh, '#3a2f5c');
  px(wx, wy + (wh >> 1), ww, 2, '#3a2f5c');
  // 窗帘

function drawGirl(t) {
  if (state.away) return;
  let key = state.pose;
  if (state.walking) key = (Math.floor(t * 7) % 2) ? 'side1' : 'side2';
  const sprite = img[key] || img.idle;
  if (!sprite) return;

  const seated = ['type','draw','read','eat','sit'].includes(key);
  const lying = key === 'lie';
  const h = lying ? 58 : seated ? 84 : 100;
  const w = sprite.width * (h / sprite.height);

  // 床面 / 坐垫 / 椅面的高度：躺着要躺到床上，坐着要坐在坐垫上
  const BED_TOP = 176, SOFA_TOP = 184, CHAIR_TOP = 176;
  let groundY = FLOOR_Y + 4;
  if (lying) {
    groundY = (state.spot === 'bed') ? BED_TOP + 2 : FLOOR_Y + 8;
  } else if (seated) {
    if (state.spot === 'bed') groundY = BED_TOP;
    else if (state.spot === 'sofa') groundY = SOFA_TOP;
    else if (state.spot === 'desk') groundY = CHAIR_TOP;
  }
  const bob = state.walking ? Math.abs(Math.sin(t * 12)) * 2 : Math.sin(t * 1.5) * 0.7;

  const drawX = (lying && state.spot === 'bed') ? SPOTS.bed : state.x;
  if (lying && state.spot === 'bed') {
    // 躺床时把整体压扁一点，像陷进被子里
    ctx.save();
    ctx.translate(drawX, groundY);
    ctx.scale(1.12, 0.62);
    ctx.drawImage(sprite, (-w / 2) | 0, -h | 0, w | 0, h | 0);
    ctx.restore();
    return;
  }
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(state.x, groundY + 2, w * 0.33, 3.6, 0, 0, Math.PI * 2); ctx.fill();

  // 朝向：向左走时水平翻转
  if (state.walking && state.facing < 0) {
    ctx.save();
    ctx.translate(state.x, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(sprite, (-w / 2) | 0, (groundY - h + bob) | 0, w | 0, h | 0);
    ctx.restore();
    return;
  }
  if (state.facing < 0) {
    ctx.save();
    ctx.translate(state.x, 0);
    ctx.scale(-1, 1);
    ctx.drawImage(sprite, (-w / 2) | 0, (groundY - h + bob) | 0, w | 0, h | 0);
    ctx.restore();
  } else {
    ctx.drawImage(sprite, (state.x - w / 2) | 0, (groundY - h + bob) | 0, w | 0, h | 0);
  }
}

function loop(now) {
  const t = now / 1000;
  const dx = state.target - state.x;
  if (Math.abs(dx) > 2) {
    state.facing = dx > 0 ? 1 : -1;
    state.x += Math.sign(dx) * 1.1;
    state.walking = true;
  } else state.walking = false;
  ctx.clearRect(0, 0, W, H);
  drawRoom(t); drawGirl(t);
  {
    const box = document.getElementById('away');
    if (state.away) {
      box.classList.add('show');
      document.getElementById('awayplace').textContent = state.awayLabel || '';
      document.getElementById('awayeta').textContent =
        state.awayRemain > 0 ? ('大概 ' + state.awayRemain + ' 分钟后回来') : '';
      // 出门时把房间压暗一点
      ctx.fillStyle = 'rgba(6,9,20,.42)';
      ctx.fillRect(0, 0, W, H);
    } else {
      box.classList.remove('show');
    }
  }
  for (let i = 0; i < 10; i++) {
    const x = (i * 67 + t * 5) % W, y = 70 + ((i * 41 + t * 8) % 130);
    ctx.fillStyle = 'rgba(180,210,255,' + (0.05 + 0.04 * Math.sin(t + i)) + ')';
    ctx.fillRect(x | 0, y | 0, 1, 1);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

let seen = new Set(), bootstrapped = false;
function render(s) {
  if (!s) return;
  try {
  // 出门状态优先：任何情况下都不要把"出门了"画成站在房间中间
  const wasAway = state.away;
  state.away = !!s.away || /出门|外出了/.test(s.activity || '');
  if (wasAway && !state.away) {
    // 刚进门：从门口走进来
    state.x = 508; state.facing = -1;
    setTimeout(() => { state.target = SPOTS[s.spot] ?? SPOTS.center; }, 120);
  }
  state.awayLabel = (s.outing && s.outing.place) ? ('去' + s.outing.place) : (s.activity || '');
  state.awayRemain = Number(s.awayRemain || 0);
  document.getElementById('mood').textContent = s.mood || '';
  const moodtags = document.getElementById('moodtags');
  if (moodtags) {
    moodtags.innerHTML = '';
    (s.moodTags || []).forEach(t => {
      const d = document.createElement('span'); d.className = 'mtag'; d.textContent = t;
      moodtags.appendChild(d);
    });
  }
  document.getElementById('activity').textContent = s.activity || '—';
  document.getElementById('recent').textContent = s.away ? ('出门前 · ' + (s.recent || '—')) : (s.recent || '—');
  document.getElementById('msgs').textContent = '今天 ' + (s.messagesToday ?? 0) + ' 条';
  document.getElementById('online').textContent = s.online ? '在线' : '睡着了';
  const weather = s.weather || {};
  const icons = {'晴':'☀','多云':'⛅','阴':'☁','小雨':'🌧','大暴雨':'⛈'};
  document.getElementById('wicon').textContent = icons[weather.kind] || '☀';
  document.getElementById('wkind').textContent = weather.kind || '晴';
  document.getElementById('wtemp').textContent = (weather.temp ?? 24) + '℃';
  document.getElementById('wclock').textContent = s.clock || clockStr || '--:--';
  document.getElementById('wdate').textContent = (s.date || '') + ' ' + (s.weekday || '') + ' · ' + (s.season || '');
  const modeName = { asleep: '睡觉中', nap: '午睡中', night_owl: '熬夜中' };
  document.getElementById('wphase').textContent = modeName[s.sleepMode] || (s.phase || '白天');
  daylight = Number(s.daylight ?? 0);
  lights = s.lights || {};
  sleepMode = s.sleepMode || 'awake';
  rainKind = weather.kind === '大暴雨' ? 'storm' : weather.kind === '小雨' ? 'rain' : '';
  document.getElementById('wishline').textContent = s.wish || '';
  // 昼夜与天气色调
  const phase = s.phase || '下午';
  dayTint = phase === '深夜' || phase === '晚上' ? 0.55 : phase === '清晨' ? 0.25 : phase === '上午' ? 0.06 : 0.14;
  rainKind = weather.kind === '大暴雨' ? 'storm' : weather.kind === '小雨' ? 'rain' : '';

  ustate.umbrella = s.umbrella || { rain: true, sun: true };
  ustate.wet = !!s.wet;
  const wetTag = document.getElementById('wettag');
  if (wetTag) wetTag.style.display = s.wet ? 'inline-block' : 'none';

  const wallet = s.wallet || {};
  document.getElementById('balance').textContent = '¥' + Number(wallet.balance ?? 0).toFixed(1);
  document.getElementById('goallabel').textContent = '攒钱买：' + (wallet.goal || '—');
  window.__eco = s.economy || window.__eco || { incomes: [], shops: [] };
  const rows = wallet.log || [];
  const sub = document.getElementById('ledgersub');
  if (sub) {
    sub.textContent = '余额 ¥' + Number(wallet.balance ?? 0).toFixed(1) +
      ' · 目标「' + (wallet.goal || '—') + '」已存 ' + Number(wallet.saved ?? 0).toFixed(1) +
      ' / ' + Number(wallet.target ?? 0).toFixed(0) + ' 元';
  }
  const box = document.getElementById('ledgerrows');
  if (box) {
    box.innerHTML = '';
    const list = rows.slice().reverse();
    if (!list.length) box.innerHTML = '<div class="row"><span>还没有记录</span><span>—</span></div>';
    list.forEach(it => {
      const d = document.createElement('div');
      d.className = 'row';
      const amount = Number(it.amount || 0);
      d.innerHTML = '<span>' + (it.time || '') + ' ' + (it.reason || '') + '</span>' +
        '<span class="' + (amount >= 0 ? 'plus' : 'minus') + '">' +
        (amount >= 0 ? '+' : '') + amount.toFixed(1) + '</span>';
      box.appendChild(d);
    });
  }
  const pct = wallet.target ? Math.min(100, (wallet.saved / wallet.target) * 100) : 0;
  document.getElementById('goalfill').style.width = pct.toFixed(1) + '%';
  document.getElementById('goalsaved').textContent =
    Number(wallet.saved ?? 0).toFixed(1) + ' / ' + Number(wallet.target ?? 0).toFixed(0) + ' 元';
  const awayline = document.getElementById('awayline');
  if (awayline) awayline.textContent = s.away ? '（人不在房间里）' : '';

  const extra = [];
  if (s.qqStatus) extra.push('QQ 状态：' + s.qqStatus);
  if (s.wet) extra.push('刚淋了点雨');
  if (s.body) extra.push('身体：' + s.body);
  if (s.emotion) extra.push('情绪：' + s.emotion);
  if (s.festival) extra.push('今天是' + s.festival);
  const tagbox = document.getElementById('tags');
  if (tagbox) tagbox.innerHTML = '';
  extra.forEach(t => {
    const d = document.createElement('span'); d.className = 'tag'; d.textContent = t;
    if (tagbox) tagbox.appendChild(d);
  });

  const stats = s.stats || {};
  const statNodes = document.querySelectorAll('#stats .stat');
  STAT_ORDER.forEach(([name], index) => {
    const row = statNodes[index];
    if (!row) return;
    const fill = row.querySelector('.fill');
    const val = row.querySelector('.val');
    let value = Number(stats[name]);
    if (!isFinite(value)) value = 50;
    value = Math.max(0, Math.min(100, value));
    if (fill) fill.style.width = value + '%';
    if (val) val.textContent = String(Math.round(value));
  });
  const done = document.getElementById('donerecent');
  if (done) {
    const rows = (s.log && s.log.length) ? s.log : [];
    const last = rows.slice(-3).reverse().map(it => (it.time ? it.time + ' ' : '') + (it.text || ''));
    done.textContent = last.length ? '刚做过：' + last.join(' · ') : '';
  }
  let spot = s.spot || 'sofa';
  if (!SPOTS[spot] || spot === 'center' || spot === 'away') spot = 'sofa';
  state.spot = spot;
  state.target = SPOTS[spot];
  let pose = s.action || 'phone';
  if (!['idle','walk1','walk2','sit','type','draw','read','lie','phone','eat'].includes(pose)) pose = 'phone';
  if (pose === 'idle' || pose === 'walk') pose = (state.spot === 'bed' || state.spot === 'sofa') ? 'sit' : 'phone';
  if (!state.walking) state.pose = pose;
  if (s.props) props = s.props;
  } catch (err) { console.warn('render error', err); }
}

async function poll() {
  try {
    const password = sessionStorage.getItem('luoxue_console_pwd') || sessionStorage.getItem('luoxue_brain_pw');
    const headers = password ? { 'X-Password': password } : {};
    const r = await fetch('/roomapi/state?t=' + Date.now(), { cache: 'no-store', headers });
    const data = await r.json();
    render(data.state);
    const events = data.events || [];
    if (!bootstrapped) {
      // 首屏不重放历史：先把已有的全部标记为已读
      events.forEach(ev => seen.add(ev.ts + '|' + ev.role + '|' + (ev.text || '').slice(0, 20)));
      const last = events[events.length - 1];
      if (last && Date.now() / 1000 - last.ts < 40) {
        if (last.role === 'owner') showPhone(last.text); else bubble(last.text);
      }
      bootstrapped = true;
      return;
    }
    events.forEach(ev => {
      const key = ev.ts + '|' + ev.role + '|' + (ev.text || '').slice(0, 20);
      if (seen.has(key)) return;
      seen.add(key);
      if (seen.size > 300) seen.clear();
      if (ev.role === 'owner') { showPhone(ev.text); state.pose = 'phone'; }
      else bubble(ev.text);
    });
  } catch (e) {}
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const scale = Math.min(rect.width / W, rect.height / H);
  const offX = (rect.width - W * scale) / 2;
  const offY = (rect.height - H * scale) / 2;
  const cx = (e.clientX - rect.left - offX) / scale;
  const cy = (e.clientY - rect.top - offY) / scale;
  // 任何物品都能点出名字
  const matched = HOTSPOTS.filter(o => cx >= o.x && cx <= o.x + o.w && cy >= o.y && cy <= o.y + o.h);
  matched.sort((a, b) => (a.w * a.h) - (b.w * b.h));
  const hit = matched[0];
  if (hit) showObjName(hit.name, e.clientX, e.clientY);
  if (hit && hit.name === '书架') openBooks();
  if (cx < WARD.x - 6 || cx > WARD.x + WARD.w + 6 || cy < WARD.y - 6 || cy > WARD.y + WARD.h + 6) return;
  state.wardrobe.open = !state.wardrobe.open;
  if (state.wardrobe.open) {
    const now = Date.now();
    if (now - state.wardrobe.lastText > 5000) {
      state.wardrobe.lastText = now;
      floatWardrobeText();
    }
  }
});

async function openBooks() {
  const box = document.getElementById('books');
  const list = document.getElementById('booklist');
  box.classList.add('show');
  document.getElementById('bookssub').textContent = '加载中…';
  list.innerHTML = '';
  let books = window.__books || [];
  try {
    const r = await fetch('/roomapi/state?t=' + Date.now(), { cache: 'no-store' });
    const data = await r.json();
    if (data && data.state && Array.isArray(data.state.books)) books = data.state.books;
  } catch (e) {}
  window.__books = books;
  document.getElementById('bookssub').textContent = '一共 ' + books.length + ' 本';
  if (!books.length) list.innerHTML = '<div class="bk">书架还是空的</div>';
  books.slice().reverse().forEach((b, i) => {
    const title = (typeof b === 'string') ? b : (b.title || '');
    const date = (typeof b === 'string') ? '' : (b.at || '');
    const store = (typeof b === 'string') ? '' : (b.store || '');
    const d = document.createElement('div');
    d.className = 'bk';
    d.innerHTML = '<span>' + String(books.length - i).padStart(2, '0') + '</span>' + title +
      '<em>' + [date, store].filter(Boolean).join(' · ') + '</em>';
    list.appendChild(d);
  });
}

let econDraft = null;
function renderEcon(editable) {
  const box = document.getElementById('econeditor');
  if (!box) return;
  const eco = econDraft || (window.__eco || { incomes: [], stores: [] });
  box.innerHTML = '';

  const t1 = document.createElement('div');
  t1.className = 'sub';
  t1.style.margin = '8px 0 2px';
  t1.textContent = '收入来源（名称 / 最低 / 最高）';
  box.appendChild(t1);
  (eco.incomes || []).forEach((row, i) => {
    const d = document.createElement('div');
    d.className = 'econrow';
    d.innerHTML = '<input data-f="name" value="' + (row.name || '') + '" ' + (editable ? '' : 'disabled') + '>' +
      '<input data-f="min" type="number" value="' + (row.min ?? 0) + '" ' + (editable ? '' : 'disabled') + '>' +
      '<input data-f="max" type="number" value="' + (row.max ?? 0) + '" ' + (editable ? '' : 'disabled') + '>' +
      (editable ? '<button data-kind="income" data-i="' + i + '">×</button>' : '<span></span>');
    d.querySelectorAll('input').forEach(inp => {
      inp.oninput = () => {
        const row2 = econDraft.incomes[i];
        if (!row2) return;
        if (inp.dataset.f === 'name') row2.name = inp.value;
        else row2[inp.dataset.f] = Number(inp.value || 0);
      };
    });
    box.appendChild(d);
  });
  if (editable) {
    const add = document.createElement('div');
    add.className = 'econadd';
    add.textContent = '＋ 添加收入类型';
    add.onclick = () => { econDraft.incomes.push({ name: '新收入', min: 10, max: 10 }); renderEcon(true); };
    box.appendChild(add);
  }

  (eco.stores || []).forEach((store, si) => {
    const head = document.createElement('div');
    head.className = 'sub';
    head.style.margin = '10px 0 2px';
    if (editable) {
      head.innerHTML = '<input class="storename" value="' + (store.name || '') + '">' +
        ' <span style="cursor:pointer;color:#ff9e9e" data-delstore="' + si + '">删除店铺</span>';
      const inp = head.querySelector('input');
      inp.oninput = () => { if (econDraft.stores[si]) econDraft.stores[si].name = inp.value; };
    } else {
      head.innerHTML = '<b>' + store.name + '</b>';
    }
    box.appendChild(head);
    (store.items || []).forEach((item, ii) => {
      const d = document.createElement('div');
      d.className = 'econrow shop';
      d.innerHTML = '<input data-f="name" value="' + (item.name || '') + '" ' + (editable ? '' : 'disabled') + '>' +
        '<input data-f="price" type="number" value="' + (item.price ?? 0) + '" ' + (editable ? '' : 'disabled') + '>' +
        (editable ? '<button data-kind="item" data-s="' + si + '" data-i="' + ii + '">×</button>' : '<span></span>');
      d.querySelectorAll('input').forEach(inp => {
        inp.oninput = () => {
          const it = econDraft.stores[si] && econDraft.stores[si].items[ii];
          if (!it) return;
          if (inp.dataset.f === 'name') it.name = inp.value;
          else it.price = Number(inp.value || 0);
        };
      });
      box.appendChild(d);
    });
    if (editable) {
      const addItem = document.createElement('div');
      addItem.className = 'econadd';
      addItem.textContent = '＋ 给「' + store.name + '」加商品';
      addItem.onclick = () => { store.items.push({ name: '新商品', price: 10 }); renderEcon(true); };
      box.appendChild(addItem);
    }
  });

  if (editable) {
    const addStore = document.createElement('div');
    addStore.className = 'econadd';
    addStore.textContent = '＋ 添加店铺';
    addStore.onclick = () => { econDraft.stores.push({ name: '新店铺', items: [] }); renderEcon(true); };
    box.appendChild(addStore);

    const save = document.createElement('button');
    save.className = 'savebtn';
    save.textContent = '保存资金出入设置';
    save.onclick = async () => {
      try {
        const r = await fetch('/roomapi/economy', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(Object.assign({ password: window.__econPwd || '' }, econDraft))
        });
        if (r.status === 403) { alert('密码不对，没有保存'); return; }
        const data = await r.json();
        if (!data.ok) { alert('保存失败：' + (data.error || '未知错误')); return; }
        const sub = document.getElementById('ledgersub');
        if (sub) sub.textContent = '已保存，正在生效…';
        setTimeout(() => poll(), 1200);
        setTimeout(() => poll(), 4000);
      } catch (e) {
        alert('保存失败：网络错误');
      }
    };
    box.appendChild(save);

    box.querySelectorAll('button[data-kind]').forEach(btn => {
      btn.onclick = () => {
        const kind = btn.dataset.kind;
        if (kind === 'income') econDraft.incomes.splice(Number(btn.dataset.i), 1);
        else econDraft.stores[Number(btn.dataset.s)].items.splice(Number(btn.dataset.i), 1);
        renderEcon(true);
      };
    });
    box.querySelectorAll('[data-delstore]').forEach(el => {
      el.onclick = () => { econDraft.stores.splice(Number(el.dataset.delstore), 1); renderEcon(true); };
    });
  }
}

let econUnlocked = false;

const econBtnEl = document.getElementById('econbtn');
if (econBtnEl) econBtnEl.onclick = async () => {
  const box = document.getElementById('econeditor');
  const btn = document.getElementById('econbtn');
  if (!econUnlocked) {
    const pwd = prompt('修改资金出入设置需要密码：');
    if (pwd === null) return;
    try {
      const r = await fetch('/roomapi/auth', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd }) });
      const data = await r.json();
      if (!data.ok) { alert('密码不对'); return; }
    } catch (e) { alert('校验失败'); return; }
    econUnlocked = true;
    window.__econPwd = pwd;
  }
  const open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  btn.textContent = open ? '资金出入设置 ▴' : '资金出入设置 ▾';
  if (open) {
    window.__eco = window.__eco || { incomes: [], stores: [] };
    econDraft = JSON.parse(JSON.stringify(window.__eco));
    renderEcon(true);
  }
};
