<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>豆包登录 · 扫码</title>
<style>
  :root{--bg:#070b14;--card:rgba(16,22,38,.9);--line:rgba(120,190,255,.2);--txt:#e3eeff;--dim:#8ba3c4;--acc:#7ff0d0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(700px 380px at 30% -10%,#12253a 0,rgba(7,11,20,0) 70%),var(--bg);
    color:var(--txt);font-family:"Segoe UI","PingFang SC",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 24px;max-width:420px;
    box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center}
  h1{font-size:17px;margin:0 0 6px;letter-spacing:1px}
  .sub{font-size:12px;color:var(--dim);line-height:1.8;margin-bottom:14px}
  .qr{width:212px;height:212px;margin:0 auto 12px;border-radius:12px;overflow:hidden;
    background:#fff;display:grid;place-items:center;border:1px solid var(--line)}
  .qr img{width:100%;height:100%;object-fit:contain;display:block}
  .steps{text-align:left;font-size:12px;color:#cfe3ff;line-height:2;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:6px}
  .steps b{color:var(--acc)}
  .tip{font-size:11px;color:var(--dim);margin-top:10px}
  .ok{color:var(--acc);font-size:13px;margin-top:8px;display:none}
</style>
<link rel="stylesheet" href="/site.css?v=2">
<script defer src="/site.js?v=2"></script>
</head>
<body class="site-page site-tool">
<div data-site-nav="doubao"></div>
<div class="card">
  <h1>豆包登录 · 手机扫码</h1>
  <div class="sub">二维码每 6 秒刷新一次，用手机豆包 App 扫一下就行（不用验证码）。</div>
  <div class="qr"><img id="qr" alt="豆包登录二维码" hidden><p id="qr-status" role="status">正在检查二维码…</p></div>
  <div class="steps">
    <div>1. 手机打开 <b>豆包 App</b></div>
    <div>2. 右上角「+」→ <b>扫一扫</b></div>
    <div>3. 扫上面的码，手机上点确认</div>
  </div>
  <div class="ok" id="ok">已登录成功 ✓ 可以关掉这个页面了</div>
  <div class="tip">扫完后我这边会自动保存登录态，之后她画图就能叫豆包帮忙。</div>
</div>
<script>
const img = document.getElementById('qr');
const status = document.getElementById('qr-status');
async function checkQR(){
  try{
    const response = await fetch('/doubao-qr.png', {method:'HEAD',cache:'no-store'});
    const changed = Date.parse(response.headers.get('Last-Modified'));
    if(!response.ok || !Number.isFinite(changed) || Date.now()-changed>180000)throw new Error('expired');
    const url = '/doubao-qr.png?v='+changed;
    if(img.getAttribute('src')!==url)img.src=url;
    img.hidden=false;status.hidden=true;
  }catch{
    img.hidden=true;status.hidden=false;
    status.textContent='暂无有效二维码。登录服务生成新码后，这里会自动显示。';
  }
}
checkQR();setInterval(checkQR,6000);
</script>
</body>
</html>
