<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洛雪 · 音色库</title>
<style>
  :root{--bg:#05080f;--panel:rgba(14,20,34,.92);--line:rgba(120,190,255,.2);--txt:#dfeaff;--dim:#8298b8;--acc:#7ff0d0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
    radial-gradient(760px 400px at 20% -10%,#122a44 0,rgba(5,8,15,0) 70%),var(--bg);
    color:var(--txt);font-family:"Segoe UI","PingFang SC",system-ui,sans-serif;padding:20px 16px 48px}
  .wrap{max-width:860px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px;letter-spacing:1px}
  .sub{color:var(--dim);font-size:12.5px;line-height:1.85}
  .bar{display:flex;gap:8px;align-items:center;margin:14px 0 4px;flex-wrap:wrap}
  .filter{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;
    color:#eaf3ff;padding:6px 10px;font-size:12.5px;outline:none;flex:1;min-width:160px}
  .count{font-size:11.5px;color:var(--dim)}
  .list{margin-top:10px;display:flex;flex-direction:column;gap:9px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:11px 13px}
  .card.current{border-color:rgba(127,240,208,.5)}
  .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .idx{font-size:10.5px;color:#5f7797;min-width:22px}
  .name{font-size:13.5px}
  .badge{font-size:10px;color:var(--acc);border:1px solid rgba(127,240,208,.35);border-radius:999px;padding:1px 7px}
  .meta{font-size:10.5px;color:var(--dim);margin-left:auto}
  .controls{display:flex;align-items:center;gap:10px;margin-top:9px}
  .play{flex:0 0 auto;min-width:88px;height:36px;border-radius:10px;cursor:pointer;
    border:1px solid rgba(143,216,255,.35);background:rgba(143,216,255,.16);color:#eaf6ff;font-size:12.5px}
  .play.playing{background:rgba(127,240,208,.2);border-color:rgba(127,240,208,.5);color:#d9fff4}
  .track{flex:1;height:6px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;min-width:70px}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fd8ff,#7ff0d0)}
  .time{font-size:10.5px;color:var(--dim);min-width:60px;text-align:right}
  .hint{margin-top:18px;color:var(--dim);font-size:12px;line-height:1.9}
  .hint a{color:#8fd8ff;text-decoration:none}
  .err{color:#ff9e9e;font-size:11.5px;margin-top:6px;display:none}
</style>
<link rel="stylesheet" href="/site.css?v=2">
<script defer src="/site.js?v=2"></script>
</head>
<body class="site-page site-tool">
<div data-site-nav="voices"></div>
<div class="wrap">
  <h1>洛雪 · 音色库</h1>
  <div class="sub">Fish Audio 上的中文女声（御姐 / 少御 / 台湾甜妹为主），共 <b id="total">24</b> 种，名字是上传者原本起的。</div>
  <div class="sub">台词：「窗户开着呢，风有点凉。你要是回来得早，我给你留一盏灯。」</div>

  <div class="bar">
    <input class="filter" id="filter" placeholder="搜名字，比如 甜 / 御姐 / 女主播">
    <span class="count" id="count"></span>
  </div>

  <div class="list" id="list"></div>

  <div class="hint">
    · 选中后我改一个参考 ID 就换掉她的声音，其他逻辑不动<br>
    · 想自己翻更多：<a href="https://fish.audio/" target="_blank" rel="noopener">fish.audio 网站</a> → 登录后进 Voice Library<br>
    · <a href="/">← 回到房间</a>
  </div>
</div>

<script>
let playing = null;
let items = [];

function stopAll() {
  if (playing) {
    playing.audio.pause();
    playing.audio.currentTime = 0;
    playing.btn.textContent = '▶ 试听';
    playing.btn.classList.remove('playing');
    playing.fill.style.width = '0%';
    playing = null;
  }
}

function fmt(s) {
  if (!isFinite(s)) return '0:00';
  return Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
}

function makeCard(item, index) {
  const card = document.createElement('div');
  card.className = 'card' + (item.current ? ' current' : '');

  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="idx">' + String(index + 1).padStart(2, '0') + '</span>' +
    '<span class="name">' + item.title + '</span>' +
    (item.current ? '<span class="badge">当前在用</span>' : '') +
    '<span class="meta">使用量 ' + (item.tasks || 0).toLocaleString() + '</span>';

  const controls = document.createElement('div');
  controls.className = 'controls';
  const btn = document.createElement('button');
  btn.className = 'play';
  btn.type = 'button';
  btn.textContent = '▶ 试听';
  const track = document.createElement('div');
  track.className = 'track';
  const fill = document.createElement('i');
  track.appendChild(fill);
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = '0:00';
  controls.appendChild(btn);
  controls.appendChild(track);
  controls.appendChild(time);

  const err = document.createElement('div');
  err.className = 'err';
  err.textContent = '加载失败，点这里直链播放：' + item.slug;

  card.appendChild(head);
  card.appendChild(controls);
  card.appendChild(err);

  const audio = new Audio();
  audio.preload = 'none';
  audio.src = '/voices/' + item.slug + '.mp3';

  btn.addEventListener('click', function () {
    if (playing && playing.audio === audio) {
      if (audio.paused) { audio.play(); btn.textContent = '⏸ 暂停'; btn.classList.add('playing'); }
      else { audio.pause(); btn.textContent = '▶ 试听'; btn.classList.remove('playing'); }
      return;
    }
    stopAll();
    playing = { audio: audio, btn: btn, fill: fill };
    btn.textContent = '加载中…';
    audio.play().then(function () {
      btn.textContent = '⏸ 暂停';
      btn.classList.add('playing');
    }).catch(function () {
      btn.textContent = '▶ 试听';
      err.style.display = 'block';
    });
  });

  audio.addEventListener('timeupdate', function () {
    if (audio.duration) {
      fill.style.width = (audio.currentTime / audio.duration * 100) + '%';
      time.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
    }
  });
  audio.addEventListener('ended', function () {
    btn.textContent = '▶ 试听';
    btn.classList.remove('playing');
    fill.style.width = '0%';
  });
  audio.addEventListener('error', function () { err.style.display = 'block'; });

  return card;
}

function render(keyword) {
  stopAll();
  const list = document.getElementById('list');
  list.innerHTML = '';
  const kw = (keyword || '').trim();
  const shown = items.filter(it => !kw || it.title.includes(kw));
  shown.forEach((item, i) => list.appendChild(makeCard(item, i)));
  document.getElementById('count').textContent = '显示 ' + shown.length + ' / ' + items.length;
  document.getElementById('total').textContent = items.length;
}

fetch('/voices/manifest.json?t=' + Date.now(), { cache: 'no-store' })
  .then(r => r.json())
  .then(data => { items = data; render(''); })
  .catch(() => {
    document.getElementById('list').innerHTML = '<div class="sub">清单读取失败，刷新试试</div>';
  });

document.getElementById('filter').addEventListener('input', e => render(e.target.value));
</script>
</body>
</html>
